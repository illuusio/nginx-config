---
name: Test Nginx config on Ubuntu 22.04-26.04

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ubuntu_22_04_jammy:
    uses: ./.github/workflows/reusable-test-nginx.yml
    with:
      container: "ubuntu:22.04"
      libxml_package: libxml2

  ubuntu_24_04_mantic:
    uses: ./.github/workflows/reusable-test-nginx.yml
    with:
      container: "ubuntu:24.04"
      libxml_package: libxml2

  ubuntu_26_04_resolute:
    uses: ./.github/workflows/reusable-test-nginx.yml
    with:
      container: "ubuntu:26.04"
      libxml_package: libxml2-16
